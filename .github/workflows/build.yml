name: Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Organizar archivos
        run: |
          mkdir -p app/src/main/java/es/motoracousticlab/app app/src/main/assets app/src/main/res/values app/src/main/res/values-v27 app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f MainActivity.java app/src/main/java/es/motoracousticlab/app/MainActivity.java
          cp -f index.html app/src/main/assets/index.html
          cp -f colors.xml app/src/main/res/values/colors.xml
          cp -f styles.xml app/src/main/res/values/styles.xml
          cp -f styles_v27.xml app/src/main/res/values-v27/styles.xml
          cp -f ic_fg.xml app/src/main/res/drawable/ic_fg.xml
          cp -f ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp -f mal.keystore app/mal.keystore
          cp -f app_build.gradle app/build.gradle
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MotorAcousticLab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
